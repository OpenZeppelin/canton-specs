name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Daml
        uses: ./.github/actions/setup-daml

      - name: Check repository structure and dependencies
        run: scripts/check.sh

      - name: Build all packages
        run: dpm build --all

      - name: Lint all packages
        run: scripts/check-lint.sh

      - name: Run the Daml Script tests and the coverage gate
        run: scripts/check-tests.sh

      - name: Run the identity SCU smoke test
        run: scripts/identity-hook-upgrade-smoke.sh

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Both gates take the sandbox backend, so a pull request pays no container
      # image pull. The scheduled live-ledger-gates workflow runs the same two
      # with `--localnet`. The Wallet Gateway gate fetches its npm package at run
      # time, so it stays on the schedule alone.
      - name: Run the CIP interoperability gate
        run: scripts/cip-interop-validation.sh

      - name: Run the CIP-0104 rewards walkthrough
        run: scripts/cip0104-rewards-walkthrough.sh

      - name: Check documentation links
        run: scripts/check-docs.sh
