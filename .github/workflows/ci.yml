name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # The identity SCU smoke test starts the Splice LocalNet Docker Compose
    # network, so this job also pays for the image pull and the network
    # bootstrap.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Daml
        uses: ./.github/actions/setup-daml

      - name: Check repository structure and dependencies
        run: scripts/check.sh

      - name: Build all packages
        run: dpm build --all

      - name: Lint all packages
        run: scripts/check-lint.sh

      - name: Run the identity SCU smoke test
        run: scripts/identity-hook-upgrade-smoke.sh

      - name: Check documentation links
        run: scripts/check-docs.sh
