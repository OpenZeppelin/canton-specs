name: choice coverage

# This workflow backs the README coverage badge. The test gate merges coverage
# from every Daml Script package and fails when a measured template or choice is
# uncovered.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Daml
        uses: ./.github/actions/setup-daml

      - name: Build all packages
        run: dpm build --all

      - name: Run all Daml Script packages and enforce coverage
        run: scripts/check-tests.sh
