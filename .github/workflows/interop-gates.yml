name: interop-gates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: interop-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  localnet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache DPM and SDKs
        uses: actions/cache@v4
        with:
          path: ~/.dpm
          key: dpm-${{ runner.os }}-sdk-${{ hashFiles('multi-package.yaml') }}-v2

      - name: Provision DPM and the project SDK
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.dpm/bin/dpm" ]; then
            version="$(curl -sSf https://get.digitalasset.com/install/latest)"
            arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
            os="$(uname | tr '[:upper:]' '[:lower:]')"
            tarball="dpm-${version}-${os}-${arch}.tar.gz"
            tmp="$(mktemp -d)"
            curl -SLf "https://get.digitalasset.com/install/dpm-sdk/${tarball}" -o "${tmp}/${tarball}"
            mkdir -p "${tmp}/extracted"
            tar xzf "${tmp}/${tarball}" -C "${tmp}/extracted" --strip-components 1
            "${tmp}/extracted/bin/dpm" bootstrap "${tmp}/extracted"
            rm -rf "${tmp}"
          fi
          echo "$HOME/.dpm/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.dpm/bin:$PATH"
          dpm install package

      - name: Run LocalNet CIP interoperability
        run: scripts/localnet-cip-interop-validation.sh

      - name: Upload LocalNet evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localnet-interop-evidence
          path: .cache/localnet-cip-interop/
          if-no-files-found: warn
          retention-days: 30

  wallet-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache DPM and SDKs
        uses: actions/cache@v4
        with:
          path: ~/.dpm
          key: dpm-${{ runner.os }}-sdk-${{ hashFiles('multi-package.yaml') }}-v2

      - name: Provision DPM and the project SDK
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.dpm/bin/dpm" ]; then
            version="$(curl -sSf https://get.digitalasset.com/install/latest)"
            arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
            os="$(uname | tr '[:upper:]' '[:lower:]')"
            tarball="dpm-${version}-${os}-${arch}.tar.gz"
            tmp="$(mktemp -d)"
            curl -SLf "https://get.digitalasset.com/install/dpm-sdk/${tarball}" -o "${tmp}/${tarball}"
            mkdir -p "${tmp}/extracted"
            tar xzf "${tmp}/${tarball}" -C "${tmp}/extracted" --strip-components 1
            "${tmp}/extracted/bin/dpm" bootstrap "${tmp}/extracted"
            rm -rf "${tmp}"
          fi
          echo "$HOME/.dpm/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.dpm/bin:$PATH"
          dpm install package

      - name: Run Canton Wallet Gateway interoperability
        run: scripts/wallet-gateway-cip0103-interop.sh

      - name: Upload Wallet Gateway evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-gateway-interop-evidence
          path: .cache/wallet-gateway-interop/
          if-no-files-found: warn
          retention-days: 30
