name: Sync review PRs with main

on:
  workflow_dispatch:
    inputs:
      ri:
        description: The RI review PR to sync
        type: choice
        default: all
        options:
          - all
          - lending
          - cross-chain-stablecoin
          - confidential-auction

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ri:
          - lending
          - cross-chain-stablecoin
          - confidential-auction
    steps:
      - uses: actions/checkout@v4
        if: inputs.ri == 'all' || inputs.ri == matrix.ri
        with:
          fetch-depth: 0

      - name: Rebuild the review branches from main
        if: inputs.ri == 'all' || inputs.ri == matrix.ri
        env:
          RI: ${{ matrix.ri }}
        run: |
          set -euo pipefail

          HEAD_BRANCH="review/ri-${RI}"
          BASE_BRANCH="review-base/ri-${RI}"
          FILE="docs/reference-architectures/${RI}.md"

          if ! git ls-remote --exit-code origin "refs/heads/${HEAD_BRANCH}" > /dev/null; then
            echo "The review branch ${HEAD_BRANCH} does not exist. The review round is closed. Nothing to sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "${BASE_BRANCH}" origin/main
          git rm -q "${FILE}"
          git commit -q -m "chore: temporary review base without the ${RI} RI report"

          git checkout -B "${HEAD_BRANCH}"
          git checkout origin/main -- "${FILE}"
          git commit -q -m "docs: re-add the ${RI} RI report for review"

          git push -f origin "${BASE_BRANCH}" "${HEAD_BRANCH}"
