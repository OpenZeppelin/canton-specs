<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-label="Constant-product curve reserveIn times reserveOut equals k. A swap of 25 input moves the pool from reserves (100, 100) to (125, 81.6). The tangent at the pre-swap point is the spot price of 1.00; the chord to the post-swap point is the effective price of about 1.36. The fee retained on the input leaves the post-swap point above the curve, so k is non-decreasing.">
  <style>
    text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .ink    { fill: #1A2028; }
    .muted  { fill: #5B6572; }
    .warn   { fill: #B45309; }
    .accent { fill: #0E7490; }
    .s-ink    { stroke: #1A2028; }
    .s-muted  { stroke: #5B6572; }
    .s-warn   { stroke: #B45309; }
    .s-accent { stroke: #0E7490; }
    @media (prefers-color-scheme: dark) {
      .ink    { fill: #E6EAF0; }
      .muted  { fill: #98A2B0; }
      .warn   { fill: #E8A33D; }
      .accent { fill: #35BBD3; }
      .s-ink    { stroke: #E6EAF0; }
      .s-muted  { stroke: #98A2B0; }
      .s-warn   { stroke: #E8A33D; }
      .s-accent { stroke: #35BBD3; }
    }
  </style>

  <!-- axes -->
  <line class="s-ink" x1="70" y1="60" x2="70" y2="330" stroke-width="1.5"/>
  <line class="s-ink" x1="70" y1="330" x2="690" y2="330" stroke-width="1.5"/>
  <polygon class="ink" points="690,330 682,326 682,334"/>
  <text class="ink" x="690" y="354" text-anchor="end" font-size="11">reserveIn</text>
  <text class="ink" x="26" y="52" font-size="11">reserveOut</text>

  <!-- axis ticks -->
  <g class="s-muted" stroke-width="1">
    <line x1="314" y1="330" x2="314" y2="336"/>
    <line x1="466.5" y1="330" x2="466.5" y2="336"/>
    <line x1="64" y1="228.2" x2="70" y2="228.2"/>
    <line x1="64" y1="274.9" x2="70" y2="274.9"/>
  </g>
  <g class="muted" font-size="10.5">
    <text x="314" y="348" text-anchor="middle">100</text>
    <text x="466.5" y="348" text-anchor="middle">125</text>
    <text x="60" y="232" text-anchor="end">100</text>
    <text x="60" y="279" text-anchor="end">81.6</text>
  </g>

  <!-- the curve -->
  <polyline class="s-ink" fill="none" stroke-width="2"
    points="100.5,91.2 131,119 161.5,143.3 192,164.5 253,199.9 283.5,214.8 314,228.2 344.5,240.3 375,251.4 411.6,263.3 451.3,274.9 484.8,283.9 527.5,294.1 570.2,303.5 619,313 667.8,321.6"/>
  <text class="ink" x="114" y="88" font-size="10.5">reserveIn &#183; reserveOut = k</text>

  <!-- tangent at pre-swap point: spot price -->
  <line class="s-muted" x1="192" y1="177.3" x2="527.5" y2="317.3" stroke-width="1.3" stroke-dasharray="6 4"/>

  <!-- chord to post-swap point: effective price -->
  <line class="s-accent" x1="314" y1="228.2" x2="466.5" y2="274.9" stroke-width="2"/>

  <!-- delta guides -->
  <g class="s-muted" stroke-width="1" stroke-dasharray="3 3">
    <line x1="314" y1="228.2" x2="466.5" y2="228.2"/>
    <line x1="466.5" y1="228.2" x2="466.5" y2="274.9"/>
  </g>
  <text class="muted" x="390" y="220" text-anchor="middle" font-size="10.5">&#916;in = 25</text>
  <text class="muted" x="474" y="256" font-size="10.5">&#916;out = 18.4</text>

  <!-- retained fee segment: from fee-driven curve point to post-swap reserves -->
  <line class="s-warn" x1="451.3" y1="274.9" x2="466.5" y2="274.9" stroke-width="3.5"/>

  <!-- points -->
  <circle class="ink" cx="314" cy="228.2" r="4.5"/>
  <circle class="warn" cx="451.3" cy="274.9" r="3"/>
  <circle class="accent" cx="466.5" cy="274.9" r="4.5"/>
  <text class="ink" x="306" y="248" text-anchor="end" font-size="11" font-weight="600">pre-swap (100, 100)</text>
  <text class="accent" x="474" y="272" font-size="11" font-weight="600">post-swap (125, 81.6)</text>
  <text class="muted" x="474" y="287" font-size="10">sits above the curve: k grew</text>

  <!-- legend, top right -->
  <g font-size="10.5">
    <line class="s-muted" x1="430" y1="76" x2="466" y2="76" stroke-width="1.3" stroke-dasharray="6 4"/>
    <text class="ink" x="474" y="80">spot price = reserve ratio = 1.00</text>
    <line class="s-accent" x1="430" y1="101" x2="466" y2="101" stroke-width="2"/>
    <text class="ink" x="474" y="105">effective price = &#916;in/&#916;out &#8776; 1.36</text>
    <line class="s-warn" x1="430" y1="126" x2="466" y2="126" stroke-width="3.5"/>
    <text class="ink" x="474" y="130">retained fee, stays in the pool</text>
    <text class="muted" x="430" y="153">fee exaggerated to 10% for visibility</text>
  </g>
</svg>
