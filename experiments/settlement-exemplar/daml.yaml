sdk-version: 3.4.11
name: oz-experimental-settlement-exemplar
source: daml
version: 0.1.0
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  - ../../access-control/.daml/dist/oz-access-control-0.1.0.dar
  - ../../ownable/.daml/dist/oz-ownable-0.1.0.dar
  - ../../pausable/.daml/dist/oz-pausable-0.1.0.dar
  - ../token-standard-v2-mock/.daml/dist/oz-experimental-token-standard-v2-mock-0.1.0.dar
  - ../cip112-settlement/.daml/dist/oz-experimental-cip112-settlement-0.1.0.dar
build-options:
  - --target=2.1
  # Exemplar consumer: it has scripts demonstrating the library end-to-end and is
  # never shipped as a library DAR, so daml-script next to consumer templates is fine.
  - -Wno-template-interface-depends-on-daml-script
