sdk-version: 3.4.11
name: openzeppelin-experimental-cip-interop-exemplar
source: daml
version: 0.1.0
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  - ../token-standard-v2-mock/.daml/dist/openzeppelin-experimental-token-standard-v2-mock-0.1.0.dar
  - ../cip112-settlement/.daml/dist/openzeppelin-experimental-cip112-settlement-0.1.0.dar
build-options:
  - --target=2.1
  # Interop exemplar: the ERC-20 facade template (Cip0086Erc20) sits next to the
  # scripts that exercise it end-to-end; this package is never shipped as a
  # library DAR, so daml-script next to a consumer template is fine.
  - -Wno-template-interface-depends-on-daml-script
