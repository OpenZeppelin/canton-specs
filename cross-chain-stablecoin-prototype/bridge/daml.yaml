sdk-version: 3.5.8
name: openzeppelin-experimental-cross-chain-bridge
source: daml
version: 0.1.0
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  # OpenZeppelin CIP-112 registry, role grant, and pause guard; see dars/manifest.yaml.
  - ../dars/vendor/openzeppelin-tokenCIP112-workflows-v1-0.1.0.dar
  - ../dars/vendor/openzeppelin-tokenCIP112-v1-0.1.0.dar
  - ../dars/vendor/openzeppelin-scoped-authorization-grant-v1-0.1.0.dar
  - ../dars/vendor/openzeppelin-api-pausable-v1-0.1.0.dar
  - ../dars/vendor/openzeppelin-pausable-v1-0.1.0.dar
  # Splice Token Standard V2 (CIP-0112) release artifacts; never rebuilt.
  - ../dars/vendor/splice-api-token-metadata-v1-1.0.0.dar
  - ../dars/vendor/splice-api-token-holding-v2-1.0.0.dar
  - ../dars/vendor/splice-api-token-transfer-events-v2-1.0.0.dar
  - ../dars/vendor/splice-api-token-allocation-v2-1.0.0.dar
  - ../dars/vendor/splice-api-token-transfer-instruction-v2-1.0.0.dar
  - ../dars/vendor/splice-api-token-allocation-instruction-v2-1.0.0.dar
